<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>营销工具 - 产品营销入口</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="phone-shell with-tabbar">
    <header class="top-appbar">
      <div>
        <p class="eyebrow">企业微信展业</p>
        <h1>营销工具</h1>
      </div>
      <div class="avatar">RM</div>
    </header>

    <section class="hero-card">
      <p>今日营销机会</p>
      <div class="hero-grid">
        <div><strong>38</strong><span>可触达客户</span></div>
        <div><strong>6</strong><span>到期转化机会</span></div>
        <div><strong>12</strong><span>活动达标提醒</span></div>
      </div>
    </section>

    <section class="section-block">
      <div class="section-title">
        <h2>批量营销入口</h2>
        <span>按 PRD：产品/活动/话术</span>
      </div>
      <a class="entry-card primary-entry" href="product-list.html" aria-label="产品营销，进入产品列表">
        <div class="entry-icon">产</div>
        <div class="entry-content">
          <h3>产品营销</h3>
          <p>进入产品列表，选择可转发产品并匹配目标客户</p>
          <small>点击位置：整张卡片 / “进入产品列表”按钮</small>
        </div>
        <span class="pill-btn">进入产品列表</span>
      </a>
      <div class="entry-card muted-entry">
        <div class="entry-icon amber">活</div>
        <div class="entry-content">
          <h3>活动营销</h3>
          <p>活动达标权益、生日祝福、节日维护模板</p>
          <small>原型展示态：暂不进入本次闭环</small>
        </div>
      </div>
      <div class="entry-card muted-entry">
        <div class="entry-icon green">话</div>
        <div class="entry-content">
          <h3>AI 话术生成</h3>
          <p>根据客户标签生成企微沟通建议</p>
          <small>原型展示态：营销前置能力</small>
        </div>
      </div>
    </section>

    <section class="note-card">
      <h2>交互说明</h2>
      <p>一级营销页保留四大底栏；从产品列表开始进入二级及更深页面，仅保留左上角返回，不固定展示首页/客户/营销/我的底栏。</p>
    </section>

    <nav class="tabbar" aria-label="主导航">
      <span>首页</span><span>客户</span><span class="active">营销</span><span>我的</span>
    </nav>
  </main>
</body>
</html>
