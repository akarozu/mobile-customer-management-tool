<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>产品详情 - 稳盈91天</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="phone-shell subpage">
    <header class="sub-header">
      <button class="back-btn" onclick="history.back()" aria-label="返回">‹</button>
      <div><p class="eyebrow">产品详情</p><h1>稳盈 91 天固收理财</h1></div>
    </header>

    <section class="detail-hero">
      <span class="risk low">R2 稳健</span>
      <h2>适配到期资金承接与稳健配置</h2>
      <div class="hero-metrics">
        <div><strong>3.15%</strong><span>业绩比较基准</span></div>
        <div><strong>91天</strong><span>投资期限</span></div>
        <div><strong>1万</strong><span>起购金额</span></div>
      </div>
    </section>

    <section class="section-block">
      <h2>营销卖点</h2>
      <ul class="copy-list">
        <li>承接 7 日内到期存款，风险等级匹配稳健客户。</li>
        <li>支持企微一键转发产品卡片，客户可查看详情。</li>
        <li>满 20 万可参与积分权益活动，提升转化理由。</li>
      </ul>
    </section>

    <section class="section-block">
      <h2>边界与异常场景</h2>
      <div class="state-row warning"><b>风险不匹配</b><span>目标客户页标红并禁止勾选</span></div>
      <div class="state-row"><b>产品额度不足</b><span>确认页提示改选其他产品</span></div>
      <div class="state-row"><b>客户已触达</b><span>列表展示“今日已发送”标签</span></div>
    </section>

    <a class="bottom-primary" href="target-customer.html">选择目标客户</a>
  </main>
</body>
</html>
