<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>发送结果</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="phone-shell subpage">
    <header class="sub-header">
      <button class="back-btn" onclick="history.back()" aria-label="返回">‹</button>
      <div><p class="eyebrow">企微触达</p><h1>发送结果</h1></div>
    </header>

    <section class="result-card">
      <div class="result-icon">✓</div>
      <h2>已提交企微群发</h2>
      <p>3 位客户发送成功，营销记录已同步至客户动态。</p>
    </section>

    <section class="section-block">
      <h2>发送明细</h2>
      <div class="state-row success"><b>李女士</b><span>发送成功 · 明日到期</span></div>
      <div class="state-row success"><b>陈先生</b><span>发送成功 · 强意向</span></div>
      <div class="state-row success"><b>王女士</b><span>发送成功 · 7日后到期</span></div>
      <div class="state-row warning"><b>赵先生</b><span>未发送 · 风险不匹配，已在上一步拦截</span></div>
    </section>

    <section class="section-block">
      <h2>后续跟进</h2>
      <div class="follow-card"><strong>明日 09:30</strong><span>提醒跟进未回复客户</span></div>
      <div class="follow-card"><strong>客户点击产品卡片</strong><span>自动生成高意向动态</span></div>
    </section>

    <a class="bottom-secondary" href="marketing.html">返回营销首页</a>
  </main>
</body>
</html>
